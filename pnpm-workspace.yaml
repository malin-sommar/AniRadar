# pnpm blocks dependency install scripts by default. These packages ship
# prebuilt platform binaries through optional dependencies, so their scripts
# aren't needed.
ignoredBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver

# The Supabase CLI downloads its binary in an install script.
onlyBuiltDependencies:
  - supabase
