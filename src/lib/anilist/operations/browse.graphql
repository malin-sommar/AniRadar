# Browse, search and the search overlay. Every filter is optional; AniList
# ignores arguments that are left out. Leave out $isAdult to include adult
# entries (an explicit null makes AniList return nothing).
query BrowseAnime(
  $page: Int = 1
  $perPage: Int = 30
  $search: String
  $genres: [String]
  $tags: [String]
  $season: MediaSeason
  $seasonYear: Int
  $formats: [MediaFormat]
  $statuses: [MediaStatus]
  $sort: [MediaSort] = [POPULARITY_DESC]
  $isAdult: Boolean
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
      currentPage
    }
    media(
      type: ANIME
      search: $search
      genre_in: $genres
      tag_in: $tags
      season: $season
      seasonYear: $seasonYear
      format_in: $formats
      status_in: $statuses
      sort: $sort
      isAdult: $isAdult
    ) {
      ...MediaCard
      ...SeriesLinks
    }
  }
}
