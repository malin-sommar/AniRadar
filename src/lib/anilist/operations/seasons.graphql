# Walks a franchise's prequel/sequel chain: the entries asked for, their
# relations, and their relations' relations (IDs only), so each request
# covers two steps.
query SeasonChain($ids: [Int]!) {
  Page(page: 1, perPage: 50) {
    media(id_in: $ids, type: ANIME) {
      ...SeasonNode
      relations {
        edges {
          ...RelatedSeason
        }
      }
    }
  }
}
