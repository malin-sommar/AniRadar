# Fields every anime card needs. Keep this lean: it's fetched for every grid.
fragment MediaCard on Media {
  id
  title {
    romaji
    english
    native
  }
  coverImage {
    medium
    large
    extraLarge
    color
  }
  format
  status
  episodes
  season
  seasonYear
  averageScore
  genres
  isAdult
  nextAiringEpisode {
    airingAt
    episode
  }
}

# Relation links on browse, search and list results, so seasons of one
# series can be grouped into one card (and a lone sequel labelled with what
# it continues) without extra requests. A related entry's status and start
# tell the list when a sequel is announced.
fragment SeriesLinks on Media {
  startDate {
    year
    month
    day
  }
  relations {
    edges {
      relationType(version: 2)
      node {
        id
        type
        format
        status
        startDate {
          year
          month
        }
        title {
          romaji
          english
          native
        }
      }
    }
  }
}

# One entry in a franchise's season chain (seasons, movies, specials).
fragment SeasonNode on Media {
  id
  type
  format
  status
  averageScore
  title {
    romaji
    english
    native
  }
  coverImage {
    medium
    large
    extraLarge
    color
  }
  startDate {
    year
    month
    day
  }
  seasonYear
  episodes
  isAdult
  siteUrl
}

# A related entry plus the IDs of its own relations, so the season chain can
# be walked two steps per request.
fragment RelatedSeason on MediaEdge {
  relationType(version: 2)
  node {
    ...SeasonNode
    relations {
      edges {
        relationType(version: 2)
        node {
          id
          type
        }
      }
    }
  }
}

# A character with their voice actors in every language. (Aliasing
# voiceActors(language: …) twice returns the same list for both aliases, so
# the app picks Japanese and English from this one list.)
fragment CharacterEdge on CharacterEdge {
  id
  role
  node {
    id
    name {
      full
      native
    }
    image {
      medium
      large
    }
  }
  voiceActors(sort: [RELEVANCE, ID]) {
    id
    languageV2
    name {
      full
      native
    }
    image {
      medium
      large
    }
  }
}
