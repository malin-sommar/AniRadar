# Home: "Trending now". bannerImage feeds the hero at the top of the page.
query TrendingAnime(
  $page: Int = 1
  $perPage: Int = 25
  $isAdult: Boolean = false
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
      currentPage
    }
    media(
      type: ANIME
      sort: [TRENDING_DESC, POPULARITY_DESC]
      isAdult: $isAdult
    ) {
      ...MediaCard
      bannerImage
    }
  }
}
